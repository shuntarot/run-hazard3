[dut]
module = "hazard3_top"

[clock.i_clk]
freq_mhz = 50

# One address space. The 64 KB from 0x8000_0000, the core's reset vector,
# are FPGA memory (tcm); DRAM (dmem) starts right after it. `hio cpu boot`
# loads each segment into the memory that covers it, and `dut_base` is how it
# knows.
[bundle.tcm]
backing    = "bram"
latency    = 1
depth      = 16384
addressing = "byte"
dut_base   = 0x8000_0000
ports      = { addr = "o_tcm_addr", re = "o_tcm_re", rdata = "i_tcm_rdata",
               wdata = "o_tcm_wdata", we = "o_tcm_we", wstrb = "o_tcm_wstrb" }

# 256 MB of it: all of the Arty's, and on a bigger board, as much as fits
# below the top of the 32-bit address space.
[bundle.dmem]
backing  = "dram"
aperture = "1M"
depth    = "64M"
dut_base = 0x8001_0000
ports    = ["dmem"]

# The Debug Module's DMI. `hio cpu` finds it here. Its reset is the
# harness's own, so `hio reset` leaves the debugger's state alone.
[bundle.dmi]
backing = "dmi"
reset   = "i_dm_rst"
